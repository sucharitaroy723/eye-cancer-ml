name: eye-cancer-ml
channels:
  - conda-forge
  - r
  - defaults
dependencies:
  - r-base=4.3.2
  - r-essentials=4.3
  # Core ML packages
  - r-caret=6.0_94
  - r-randomforest=4.7_1.1
  - r-xgboost=1.7.7.1
  - r-glmnet=4.1_8
  - r-nnet=7.3_19
  # Data manipulation
  - r-dplyr=1.1.4
  - r-tidyr=1.3.0
  - r-readr=2.1.4
  # Visualization
  - r-ggplot2=3.4.4
  - r-corrplot=0.92
  # Metrics
  - r-mlmetrics=1.1.1
  # R Markdown rendering
  - r-rmarkdown=2.25
  - r-knitr=1.45
  - pandoc
